name: Veille RED hebdomadaire

on:
  schedule:
    # Tous les lundis à 7h00 UTC
    - cron: '0 7 * * 1'
  # Permet aussi de lancer manuellement depuis GitHub
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install node-fetch@3

      - name: Lancer le scraping EUR-Lex + JORF
        id: scrape
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node scrape.mjs

      - name: Sauvegarder la liste des textes connus
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mise à jour cache veille réglementaire"
          file_pattern: "known-ids.json"
