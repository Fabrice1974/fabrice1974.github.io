/* ── HELPERS ── */
function fmtDate(d){
  const p=n=>String(n).padStart(2,'0');
  return ${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())};
}
function addDays(d,n){return new Date(d.getTime()+n*86400000);}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── NAVIGATION ── */
function setTab(tab){
  currentTab=tab;
  ['accueil','veille','alertes'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('hidden',t!==tab);
    const btn=document.getElementById('nav-'+t);
    btn.classList.toggle('active',t===tab);
  });
}

/* ── SCAN ── */
function handleScan(){
  if(scanLoading)return;
  scanLoading=true;
  const btn=document.getElementById('scan-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳…';}
  setTimeout(()=>{
    const d=new Date();
    lastScan=fmtDate(d);
    nextScan=fmtDate(addDays(d,7));
    scanLog=[...scanLog,{date:lastScan,hasNew:false}].slice(-20);
    scanLoading=false;
    renderAccueil();
    renderAlertes();
    if(btn){btn.disabled=false;btn.textContent='🔄 Scan';}
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('RED Monitor — Scan terminé',{body:'✅ Aucune modification — votre veille est à jour.',icon:'/favicon.ico'});
    }
  },1800);
}

/* ── TOGGLE CARTE ── */
function toggleCard(id){
  openCards[id]=!openCards[id];
  const box=document.getElementById('summary-'+id);
  const arrow=document.getElementById('arrow-'+id);
  const lbl=document.getElementById('lbl-'+id);
  if(box){box.classList.toggle('hidden',!openCards[id]);}
  if(arrow){arrow.style.transform=openCards[id]?'rotate(90deg)':'rotate(0deg)';}
  if(lbl){lbl.textContent=openCards[id]?'Masquer le résumé':'💬 Lire en clair';}
}

/* ── TOGGLE SWITCH ── */
function togglePref(key){
  prefs[key]=!prefs[key];
  const sw=document.getElementById('sw-'+key);
  if(sw){
    sw.classList.toggle('switch-on',prefs[key]);
    sw.classList.toggle('switch-off',!prefs[key]);
    const knob=sw.querySelector('.switch-knob');
    if(knob)knob.style.left=prefs[key]?'23px':'3px';
  }
}
